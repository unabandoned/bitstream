name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@c24ace1026dd66d9d5ce97d949d9efc5fa9899d1 # v1.3.7
    with:
      # engines: node >=22.12, so the 20 the shared default carries is out of range.
      node-versions: '[22, 24]'
      # Ships tsc output (dist/, dist.esm/), so CI builds before testing.
      has-build: true
