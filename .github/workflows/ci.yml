name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@7df8c67cf681d8fc7ee0831d74c1e9d8640b12a9 # v1.3.4
    with:
      # engines: node >=22.12, so the 20 the shared default carries is out of range.
      node-versions: '[22, 24]'
      # Ships tsc output (dist/, dist.esm/), so CI builds before testing.
      has-build: true
