name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@2212a52dde1417252c73f3a53c864e1aae27ac84 # v1.3.9
    with:
      # engines: node >=22.12, so the 20 the shared default carries is out of range.
      node-versions: '[22, 24]'
      # Ships tsc output (dist/, dist.esm/), so CI builds before testing.
      has-build: true
