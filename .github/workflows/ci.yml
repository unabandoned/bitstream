name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@23139a663b090be91f54115baa805f4588255aa5 # v1.3.8
    with:
      # engines: node >=22.12, so the 20 the shared default carries is out of range.
      node-versions: '[22, 24]'
      # Ships tsc output (dist/, dist.esm/), so CI builds before testing.
      has-build: true
