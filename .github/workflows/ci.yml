name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@6dfdb74cc9719e92442a28d45a3f86c855cc75cc # v1.3.6
    with:
      # engines: node >=22.12, so the 20 the shared default carries is out of range.
      node-versions: '[22, 24]'
      # Ships tsc output (dist/, dist.esm/), so CI builds before testing.
      has-build: true
