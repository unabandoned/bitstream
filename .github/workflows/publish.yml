name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@2212a52dde1417252c73f3a53c864e1aae27ac84 # v1.3.9
    with:
      # `files` ships dist/ and dist.esm/, which tsc generates; npm publish --ignore-scripts
      # never runs prepublishOnly, so the build has to happen in the workflow.
      build-for-publish: true
    secrets: inherit
