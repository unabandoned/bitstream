name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@6dfdb74cc9719e92442a28d45a3f86c855cc75cc # v1.3.6
    with:
      # `files` ships dist/ and dist.esm/, which tsc generates; npm publish --ignore-scripts
      # never runs prepublishOnly, so the build has to happen in the workflow.
      build-for-publish: true
    secrets: inherit
