name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@c24ace1026dd66d9d5ce97d949d9efc5fa9899d1 # v1.3.7
    with:
      # `files` ships dist/ and dist.esm/, which tsc generates; npm publish --ignore-scripts
      # never runs prepublishOnly, so the build has to happen in the workflow.
      build-for-publish: true
    secrets: inherit
